<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/styles.css" />
    <title>Page not found | Sridurga Chintalapudi</title>
    <style>
      .error-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #fff; background: #0b1220; }
      .error-card { max-width: 620px; text-align: center; }
      .error-code { margin: 0 0 20px; color: #5eead4; font-family: monospace; font-size: 14px; }
      .error-card h1 { margin: 0 0 18px; font-size: clamp(42px, 8vw, 78px); line-height: 1; letter-spacing: -.06em; }
      .error-card p { margin: 0 0 30px; color: rgba(255,255,255,.65); }
    </style>
  </head>
  <body class="error-page">
    <main class="error-card">
      <p class="error-code">ERROR 404</p>
      <h1>This page took a different path.</h1>
      <p>The architecture is sound—the route just does not exist.</p>
      <a class="button button-primary" href="/">Return home</a>
    </main>
  </body>
</html>
