<p class="article-kicker">Engineering Management / Applied Case Analysis / 2026</p>
<h1>When Technology Recovers but Business Doesn't</h1>
<p class="article-deck">What the Change Healthcare cyberattack and the CrowdStrike outage reveal about cascading dependencies, measurable control effectiveness, and the difference between restoring systems and restoring essential services.</p>
<p class="article-meta"><strong>By Sridurga Chintalapudi</strong><br>
<strong>Texas State University</strong> · EMGT 7310: Risk Management and Resiliency Analysis<br>
<strong>Course project:</strong> Module 8 Capstone, Organizational Resiliency Plan<br>
<strong>Format:</strong> Independent academic case-study analysis, not a peer-reviewed empirical study</p>
<div class="case-insight"><p><strong>The central question:</strong> When a major technology dependency fails, how can management know which business functions are affected, choose effective controls, and demonstrate that service has truly recovered?</p></div>
<nav class="article-toc" aria-label="Article contents"><strong>Explore the case study</strong><div>
<a href="#problem">The problem</a><a href="#why-two">Why these incidents</a><a href="#method">Analysis method</a><a href="#workflow">Process map</a><a href="#cascades">Failure cascades</a><a href="#controls">Risk controls</a><a href="#recovery">Recovery decisions</a><a href="#takeaways">Takeaways</a></div></nav>

<section id="problem" aria-labelledby="s1">
<h2 class="case-section-heading" id="s1">1. The problem: technical availability is not business continuity</h2>
<p>A distributed service can report healthy application instances while essential business work remains incomplete. Transactions may sit in a queue, acknowledgements may be delayed, database replicas may be inconsistent, or external counterparties may still be unreachable. Conversely, a service may be degraded yet still provide enough limited capacity to maintain critical operations.</p>
<p>This creates an engineering management problem rather than merely a troubleshooting task. Senior leaders must decide which business capability to restore first, how much residual risk to accept, whether an alternate processing pathway is adequate, and what evidence justifies communicating that service has resumed.</p>
<p>The capstone's objective was to design a defensible organizational resiliency plan for a <strong>hypothetical healthcare claims technology operator</strong> using two real 2024 incidents as public evidence. It was not an investigation into either company's undisclosed infrastructure, and it did not run a controlled experiment. Its contribution is a structured, evidence-informed comparison and an actionable approach to measurable risk treatment.</p>
<div class="case-insight"><p><strong>Why this matters:</strong> A recovery plan judged only by server uptime could declare success while healthcare providers still cannot reliably submit claims or receive traceable acknowledgements. The measurable unit of recovery must follow the essential business workflow.</p></div>
</section>

<section id="why-two" aria-labelledby="s2">
<h2 class="case-section-heading" id="s2">2. Why compare Change Healthcare and CrowdStrike?</h2>
<p>These incidents were selected deliberately because their initiating causes differ. Change Healthcare illustrates the consequences of malicious compromise of a critical service ecosystem. CrowdStrike illustrates a non-malicious software-content failure propagated through a common technology dependency. Comparing different initiating events helps distinguish <em>cause-specific prevention</em> from <em>shared organizational continuity requirements</em>.</p>
<div class="case-facts" aria-label="Verified publicly reported incident indicators">
<div class="case-fact"><strong>$2.2B</strong><span>UnitedHealth's rounded 2024 direct response costs associated with the Change Healthcare cyberattack [1]</span></div>
<div class="case-fact"><strong>$867M</strong><span>Separately estimated 2024 Optum Insight business disruption impacts [1]</span></div>
<div class="case-fact"><strong>8.5M</strong><span>Windows devices Microsoft estimated were affected by the CrowdStrike outage [3]</span></div>
</div>
<p>UnitedHealth also estimated approximately <strong>190 million individuals</strong> were affected and reported provider support through interest-free loans exceeding $9 billion through December 31, 2024 [1]. These figures illustrate the potential scale and cross-organizational effects of a concentrated service disruption; they are not independent estimates for the hypothetical organization in this study.</p>
<div class="case-table"><table>
<thead><tr><th>Comparative dimension</th><th>Change Healthcare, February 2024</th><th>CrowdStrike, July 2024</th></tr></thead><tbody>
<tr><td><strong>Trigger</strong></td><td>Cybercrime actors accessed Change Healthcare systems; testimony described compromised credentials at a remote-access portal lacking MFA [1,6].</td><td>A defective channel-file content configuration update caused Windows crashes [2].</td></tr>
<tr><td><strong>Failure category</strong></td><td>Security compromise and deliberate operational isolation</td><td>Technology change/control failure and broad endpoint disruption</td></tr>
<tr><td><strong>Business consequence</strong></td><td>Disrupted healthcare services and transaction-related workflows, with significant provider support needs [1]</td><td>Service interruptions across organizations dependent on affected Windows systems [2,3]</td></tr>
<tr><td><strong>Primary preventive question</strong></td><td>Were critical access paths protected, inventoried, and independently verified?</td><td>Could validation, staged rollout, or rollback limit defective update propagation?</td></tr>
<tr><td><strong>Common resilience question</strong></td><td colspan="2">If the primary dependency becomes unavailable, what independently tested pathway keeps the essential business function operating?</td></tr>
</tbody></table></div>
<p><strong>Important boundary:</strong> The comparison does not equate the mechanisms or consequences of the two incidents. It isolates the shared governance challenge produced by dependency concentration and incomplete service-continuity assurance.</p>
</section>

<section id="method" aria-labelledby="s3">
<h2 class="case-section-heading" id="s3">3. What is the analysis method?</h2>
<p>The study follows a management-oriented analysis sequence. Each step answers a different question. This is why the article proceeds from a business workflow to dependency failures, controls, recovery decisions, and residual risks.</p>

<p>First, the business impact analysis (BIA) determines which activities are essential and their required recovery objectives. Second, a process map identifies the technical and third-party services necessary to perform those activities. Third, the two incidents show different ways those dependencies can be lost. Fourth, risk controls are specified with accountable owners and observable acceptance tests. Finally, leaders evaluate whether measured recovery meets the business objective and document unresolved risk.</p>
</section>

<p>For analytical clarity, the capstone uses a hypothetical healthcare claims technology organization. The workflow below is a <strong>conceptual example</strong> of an end-to-end transaction, not a reconstruction of Change Healthcare's internal architecture.</p>

<p>At Change Healthcare, public testimony describes entry through a remote access portal without multifactor authentication [6]. Identity protection and containment address this initiating scenario, but they do not automatically provide alternate claims-processing capacity. At CrowdStrike, the initiating event was an unintended content update. Strengthening authentication would not have prevented that particular defect; staged release controls and recovery processes are the more relevant safeguards [2].</p>
<p>The managerial insight is that organizations need <strong>cause-specific prevention</strong> together with <strong>cause-independent continuity capabilities</strong>. A control portfolio that only strengthens one threat vector may remain exposed to outages originating elsewhere.</p>
</section>

<section id="controls" aria-labelledby="s6">
<h2 class="case-section-heading" id="s6">6. Which controls solve which problem?</h2>
<p>The capstone groups controls into prevention, containment, continuity, and assurance. Each addresses a different mechanism and should have an observable acceptance test. These are proposed requirements for the hypothetical operator, not measured performance results from Change Healthcare or CrowdStrike.</p>
<div class="case-table"><table><thead><tr><th>Specific problem</th><th>Proposed control / decision owner</th><th>Proof needed before calling it effective</th><th>Residual exposure</th></tr></thead><tbody>
<tr><td>Compromised remote or privileged access</td><td>Phishing-resistant MFA, privileged-access reviews; CISO</td><td>Inventory all routes, verify MFA enforcement, test bypass and exception closure</td><td>Compromised downstream services or unforeseen identity dependencies</td></tr>
<tr><td>Unsafe common software update</td><td>Pre-release test, segmented canary rollout, demonstrated rollback; CTO</td><td>Recorded deployment gates, automatic stop signals, rollback drill outcomes</td><td>Unknown failure modes or defects that affect all deployment rings</td></tr>
<tr><td>Primary claims intake unavailable</td><td>Independent essential-intake channel with durable identifiers; COO / Platform lead</td><td>End-to-end test: receive, acknowledge, queue, replay, reconcile without duplicates</td><td>Reduced capacity and delayed downstream processing</td></tr>
<tr><td>Production and backup share failure domain</td><td>Isolated clean environment, protected backups; CISO / Data lead</td><td>Restore from a clean account, verify RPO, data integrity, and observed recovery time</td><td>Corrupted backup snapshots or shared latent defects</td></tr>
<tr><td>External providers depend on incomplete status updates</td><td>Business-state communications and incident ownership; Customer lead / COO</td><td>Timestamped, accurate notices distinguishing queued, degraded and reconciled states</td><td>Incomplete external visibility, third-party delay, communication gaps</td></tr>
</tbody></table></div>
<p><strong>Control effectiveness is not the existence of a policy.</strong> A written rollback procedure is not proof that a large fleet can be restored. An untested backup is not demonstrated recovery capacity. A declared RTO is not the same as a measured restoration result. The required evidence must correspond to the failure the control is intended to mitigate.</p>
</section>

<section id="recovery" aria-labelledby="s7">
<h2 class="case-section-heading" id="s7">7. When is a service truly recovered?</h2>
<p>The most important recovery distinction is between <strong>technical readiness</strong> and <strong>business readiness</strong>. The hypothetical operator should not report full restoration solely because its web endpoint returns success or its servers are running. A recovery decision should inspect actual transaction progress and data consistency.</p>

<p>For example, if identity services and application servers recover but pending transactions still require replay, the service may be technically available yet only partially restored. The business impact analysis defines which functions must resume by what time. The recovery exercise measures what was actually achieved. When the observed recovery exceeds the required objective, management must decide whether to fund stronger controls, adopt a temporary workaround, or document an explicit exception [4,5].</p>
<h3>Practical measurement scorecard</h3>
<div class="case-table"><table><thead><tr><th>Indicator</th><th>How to measure</th><th>Decision supported</th></tr></thead><tbody>
<tr><td>End-to-end success</td><td>Completed, valid transactions divided by submitted eligible transactions</td><td>Whether the business process works, not just the endpoint</td></tr>
<tr><td>Unreconciled backlog</td><td>Count and age of transactions awaiting confirmed reconciliation</td><td>Whether full recovery can be declared</td></tr>
<tr><td>Observed restoration time</td><td>Elapsed time to independently verified essential processing</td><td>Whether required RTO was met</td></tr>
<tr><td>Data recovery gap</td><td>Age of the latest validated recoverable state at failure</td><td>Whether the required RPO was met</td></tr>
<tr><td>Control-test evidence</td><td>Canary result, clean restore logs, replay checks, exception tickets</td><td>Whether controls are effective and repeatable</td></tr>
<tr><td>Residual risk</td><td>Unresolved high-impact failures, their owners and treatment dates</td><td>What still needs executive acceptance or investment</td></tr>
</tbody></table></div>
<p class="case-note">No measured scorecard results are claimed here. The table identifies what an actual operator would need to collect before using the framework in production.</p>
</section>

<section id="tradeoffs" aria-labelledby="s8">
<h2 class="case-section-heading" id="s8">8. Why not simply build maximum redundancy?</h2>
<p>Resilience creates trade-offs. Warm standby can improve continuity for an important service but adds recurring infrastructure expense and energy demand. Independent intake protects a subset of business functionality, but creates an eventual replay and reconciliation obligation. More backups can improve recovery options while increasing storage and operational complexity. Active-active architectures can provide rapid failover yet also introduce coordination and data-consistency risks.</p>
<p>The capstone therefore recommends a conditional decision process: conduct the BIA, identify business-required RTO/RPO, test candidate architectures against those requirements, estimate full lifecycle cost and operational burden, and record remaining exposure. It does not assume that one architecture is always optimal, and it does not present hypothetical savings as realized financial outcomes.</p>
<p>Environmental and social consequences also matter. Recovery capacity consumes energy and hardware resources; failed healthcare transaction services may affect providers and customers beyond the direct technology operator. These impacts belong in enterprise risk decisions even when exact costs are difficult to quantify.</p>
</section>

<section id="takeaways" aria-labelledby="s9">
<h2 class="case-section-heading" id="s9">9. What did the case study establish, and what remains open?</h2>
<div class="case-insight"><p><strong>Main takeaway:</strong> Organizational resilience must be evaluated at the level of essential business outcomes. Different technical failures may require different preventive controls, but both demand independently tested continuity, truthful business-state communication, accountable recovery decisions, and explicit residual-risk ownership.</p></div>
<h3>Four lessons for engineering leaders</h3>
<ol>
<li><strong>Different causes, different prevention.</strong> Authentication and cyber containment address intrusion risk; release validation, canaries and rollback address defective updates.</li>
<li><strong>Shared dependencies amplify impact.</strong> A single identity, update, database, cloud or third-party dependency can interrupt multiple business steps at once.</li>
<li><strong>Recovery claims require business evidence.</strong> Healthy servers cannot substitute for successful transactions, complete reconciliation, and verified service capacity.</li>
<li><strong>Risk governance requires tests and owners.</strong> A control becomes credible when its acceptance criterion has been independently exercised, with failures escalated rather than hidden.</li>
</ol>
<h3>Scope and limitations</h3>
<p>This work is a <strong>comparative applied case analysis</strong> supported by publicly available evidence and a hypothetical claims-processing model. It does not estimate incident probabilities from a representative dataset, measure the effectiveness of implemented controls in an actual operator, or prove that one recovery architecture has superior cost or performance. Any architecture recommendation remains conditional on measured tests and a validated BIA.</p>
<p>The diagrams are original explanatory models for this case study. They are not proprietary system architecture diagrams for Change Healthcare or CrowdStrike, and no unpublished doctoral research hypotheses or experimental plans are disclosed here.</p>

<h2>6. Engineering Management takeaways</h2>
<ul>
<li><strong>Analyze dependencies, not just components.</strong> A single shared service can carry organization-wide consequences.</li>
<li><strong>Separate prevention from continuity.</strong> Controls designed for ransomware are not substitutes for safe software-release practices, and vice versa.</li>
<li><strong>Use evidence gates.</strong> Recovery declarations should depend on tested, auditable service outcomes.</li>
<li><strong>Make residual risk explicit.</strong> The organization must decide how to handle missed recovery objectives and the cost of additional safeguards.</li>
</ul>
